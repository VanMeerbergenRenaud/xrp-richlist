services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: xrprich
    volumes: [ "./.pg:/var/lib/postgresql/data", "./db:/docker-entrypoint-initdb.d" ]
    ports: [ "5432:5432" ]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d xrprich"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/xrprich
    volumes: [ "./api:/app" ]
    working_dir: /app
    ports: [ "8000:8000" ]
    depends_on:
      db:
        condition: service_healthy

  indexer:
    build: ./indexer
    command: sh -c "python run_once.py && sleep 3600 && while true; do python run_once.py; sleep 3600; done"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/xrprich
      XRPL_RPC_URL: https://s2.ripple.com:51234
    volumes: [ "./indexer:/app" ]
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./web
    command: npm run dev
    ports: [ "3000:3000" ]
    volumes:
      - "./web:/app"
      - "/app/node_modules"
    working_dir: /app
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      - API_URL=http://api:8000
    depends_on: [ api ]

